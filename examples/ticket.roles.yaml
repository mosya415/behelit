# The complete pipeline: block for `lca ticket`, in one piece.
#
# The README shows it in two halves — the keys, then the args:/fields: mapping —
# because they are explained separately. An operator copying only the first half
# gets nine "lca cannot guess this" errors, which is the error working as
# intended and a documentation mistake all the same. This file is the whole
# thing, and a test parses and validates it so it cannot drift from the reader.
#
# Every tool name, argument name and reply path below is a PLACEHOLDER in some
# team's spelling. Yours are in .lca/mcp.lock.json; `lca doctor` prints them.
#
# It declares no roles on purpose — the three it NAMES (coder, reviewer,
# integrator) have to be your team's own. So this is a block to copy into your
# .lca/roles.yaml beside them, not a file to point LCA_ROLES at: on its own it
# validates everything except the roles, and says so.
#
# Check it the way lca will, once it is in place:
#
#   lca ticket -dry-run BSK-1

# Two keys that are not in the pipeline: block and that `lca ticket` will not run
# without, or will run worse without. They belong in the same defaults: block your
# roles already use, and they are here because an operator who copies only the
# block below has a pipeline with no clock on it.
defaults:
  # The one ceiling an unattended run has to have. A step count is not one: a
  # gateway that accepts the request, streams four tokens and goes silent
  # advances no steps and spends no tokens, and only a clock cancels the run.
  # `lca ticket` refuses to start without timeout: or max_tokens:. There is no
  # default, because how long your team's night is is not something lca can know.
  timeout: 45m
  # The other two ceilings, and the reason they are commented out rather than
  # filled in: the clock above ends a night, and these two bound what the night
  # may BUY. max_steps is every model request the run makes — every stage, every
  # verify attempt, every rework round, every subagent, the compactor and the
  # closing summary, all in one total. max_tokens is prompt+completion over the
  # same. A ticket that is five stages for one team is twelve for another, so
  # lca will not guess either number; run the pipeline once and read the
  # `tokens` and `steps` fields of the result object, then write them down here
  # with room to spare. Both are also `lca ticket` flags, for the night when one
  # ticket needs a shorter leash than the team's file gives it.
  # max_steps: 200
  # max_tokens: 4000000
  # The variables that hold a credential, by name. lca scrubs them out of the
  # ticket comment, the merge request body, the transcript, the trace and the
  # check log. It also guesses from the spelling — anything with TOKEN, KEY,
  # SECRET or PASSWORD in its name — and the guess misses GH_PAT, JIRA_PAT,
  # BSK_AUTH and a DATABASE_URL whose DSN carries the password. Anything the
  # mcp: block or api_key_env already references is covered without being listed;
  # this is for the variable your check_cmd or your deploy script reads.
  # redact_env: [GH_PAT, DATABASE_URL]

pipeline:
  project: BSK                  # -new only: what the ticket is created under
  branch_prefix: agent/         # the branch is this + the ticket key
  remote: origin                # push: true only
  target_branch: main
  push: true                    # true or false — there is no safe default
  rework_rounds: 1              # 0 is legal: one review, no rework
  # A branch that no longer merges into target_branch goes to a person by
  # default. true buys the integrator ONE supervised attempt at it, on the
  # ticket's own branch, after which the check runs again and the reviewer reads
  # the resolution. Off here because resolving a conflict is a decision.
  resolve_conflicts: false
  roles:
    coder: coder
    reviewer: reviewer
    integrator: integrator      # writes the MR description and the comment
  tracker:                      # YOUR tool names, out of .lca/mcp.lock.json
    read: jira__issue_get
    create: jira__issue_create  # -new only
    comment: jira__issue_comment
    transition: jira__issue_transition   # optional, with the two statuses
    status_done: In Review
    status_blocked: Needs human
    args:                           # the server's own argument names
      read:                         # one-line {…} is fine; indented keys always are
        issueIdOrKey: "${key}"
      create:
        project: "${project}"
        summary: "${summary}"
        description: "${body}"
        issuetype: Task
      comment:
        issueIdOrKey: "${key}"
        body: "${text}"
      transition:
        issueIdOrKey: "${key}"
        transition: "${status}"
    fields:                         # where in the REPLY each value is
      key:        key               # a dotted path; `.` is the reply itself
      summary:    fields.summary
      body:       fields.description
      comment_id: id
  forge:                        # push: true only
    create_merge_request: gitlab__create_merge_request
    find_merge_request: gitlab__list_merge_requests
    args:
      create_merge_request:
        source_branch: "${branch}"
        target_branch: "${target}"
        title: "${title}"
        description: "${body}"
      find_merge_request:
        source_branch: "${branch}"
        target_branch: "${target}"
        state: opened
    fields:
      list:   .                     # where the array of merge requests is
      branch: source_branch         # both ends are re-checked against what lca
      target: target_branch         # asked for: this branch into another target
      id:     iid                   # is somebody else's merge request
      url:    web_url
  skills:                       # the shared knowledge base, per stage
    ticket:   [ticket-brief]
    coder:    [deploy-to-stand, repo-conventions]
    reviewer: [review-checklist]
    mr:       [mr-description]
    report:   [ticket-comment]
