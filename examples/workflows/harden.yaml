description: Plan a change, build it in a worktree, review it across families, then commit.
role: lead

# Needs more than `lca init` writes: roles lead, coder and reviewer (the reviewer
# needs `write` in its tools for step 5's review.md), `review: reviewer` on coder
# for the cross-family review on the build step, and -var task=… on every run.
# `lca doctor` binds this file against your team and names whatever is missing.

# Every run:/check: line here is ONE command: without sandbox: {shell: true} the
# line is exec'd as argv, so `a && b` would hand "&&" to a as an argument. bind
# refuses that before anything runs — use two steps, as `build` does below.
vars:
  task:                       # no value: required, pass -var task=…
  tests: ./...

steps:
  baseline:
    run: go test -count=1 ${vars.tests}
    timeout: 1800
    # A red baseline means the verifier can't tell this change's breakage from what
    # was already broken, so nothing else should run.

  plan:
    prompt: |
      Write a build brief for this change:
      ${vars.task}

      Name the files to touch, the failure mode to avoid, and the test that proves it
      works. Answer with the brief only — it is handed verbatim to another model that
      sees none of this conversation.

  build:
    delegate: |
      ${steps.plan.out}

      Implement exactly this. Stay inside the files named above.
    role: coder
    check: go build ./...
    retries: 1
    # Two independent checks must pass: the coder role's check_cmd (its tests) and
    # this one. Then the reviewer that role names (review: reviewer in roles.yaml —
    # a different model family) judges the diff, and a "VERDICT: reject" blocks it;
    # only then is the diff applied to your tree. `review: off` here would skip
    # that. retries wrap the whole delegation while verify_attempts works inside
    # it, so the budgets multiply: -dry-run prints the effective number.

  fmt:
    run: gofmt -w .
    # Zero tokens: never ask a model to do what gofmt does.

  review:
    prompt: |
      Review this diff for correctness and for the constraints in AGENTS.md:

      ${steps.build.diff}

      Write your verdict to review.md, first line exactly "VERDICT: ship" or
      "VERDICT: rework", then the reasons.
    role: reviewer
    check: grep -q '^VERDICT: ship' review.md
    retries: 0
    # A second, WRITTEN review of the change as a whole, left in the repository and
    # decided by a command — not the same thing as the built-in cross-family review
    # on the build step above, which judges that one diff before it is applied and
    # leaves nothing behind. Keep this step when you want the artifact; drop it when
    # the reviewer role's verdict on the diff is enough.
    # retries: 0 on purpose — a retry re-prompts with "the check FAILED", which
    # pressures a model into flipping its verdict instead of reconsidering it.

  integrate:
    run: git commit -am "verified by the harden workflow"
    when: ${steps.build.status} == ok && ${steps.review.status} == ok
    # A rejected diff already failed the build step, so these two are the whole
    # guard; ${steps.build.review} (approve | reject | unreviewed | empty) is there
    # when you want to tell "a reviewer approved it" from "nobody reviewed it".
    # The task is in the run's state.json, not in this message: a ${vars.*} goes in
    # verbatim (a step's output is quoted, a var is not), so a task containing a
    # quote or a " #" would rewrite the command.
    # Last on purpose: a resume re-runs the step that failed, and this one is not
    # idempotent.
