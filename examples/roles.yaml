# Team definition for orchestration through the LLM gateway (berserk-gw).
# Copy to .lca/roles.yaml (project) or ~/.lca/roles.yaml (user).
# Point LCA_BASE_URL at the gateway, e.g. http://node:18080/v1.
# Model names are exactly what the gateway lists at /v1/models — no hosts.

entry: lead            # role of the REPL / one-shot session
transport: native      # tool calling through the gateway: native | text
                       # native needs the engines' tool-call parser enabled
                       # (vLLM:   --enable-auto-tool-choice --tool-call-parser <family>)
                       # (SGLang: --tool-call-parser auto — it has no
                       #  --enable-auto-tool-choice, and argparse refuses one)
                       # add --reasoning-parser on either to get reasoning_content

# per-model settings — e.g. a model whose native tool parser is broken on the
# engine, or the one model on the other engine when one gateway url fronts both
# (engine: outranks LCA_ENGINE and /v1/models' owned_by; the parser VALUES differ
# per engine, so lca doctor names them in that engine's own spelling):
# models:
#   some-model: {transport: text}
#   hy3:        {engine: sglang}

# ── the fleet this build carries profiles for ────────────────────────────────
# The six models the operator's gateway serves. lca already knows each one's
# context window, sampling and thinking switch from its vendor card (see
# models.go, and `lca doctor` prints the provenance of every number) — so the
# models: entries below are only needed where you want to override the card.
# Uncomment the block when the gateway serves these names; `lca doctor` reports
# any that it does not.
#
# tiers:
#   premium:  [kimi-k3, MiniMax-M3]          # the two 1M-window thinkers
#   balanced: [glm5.3, deepseek-v4.1-flash]
#   cheap:    [qwen3.6, hy3]                 # 262k windows, cheapest to run
#
# models:
#   # Only what the card actually states. Anything absent here is absent from the
#   # request too, and the server's own default applies — a guessed number is
#   # worse than no number.
#   kimi-k3:              {temperature: 1.0, top_p: 1.0,  effort: max}
#   # ^ top_p 1.0 is the card's AGENTIC value (0.95 is its single-step value).
#   deepseek-v4.1-flash:  {temperature: 1.0, top_p: 0.95, effort: high}
#   glm5.3:               {temperature: 1.0, top_p: 0.95, effort: max}
#   # ^ GLM-5.3 clamps temperature to [0,1]; an effort outside low|high|max
#   #   is silently promoted to max, so name it.
#   qwen3.6:              {temperature: 1.0, top_p: 0.95, top_k: 20}
#   # ^ no effort: reasoning_effort is documented for Qwen3.8, not for 3.6.
#   MiniMax-M3:           {temperature: 1.0, top_p: 0.95}
#   # ^ no effort either: M3 ignores the field. top_k 40 is engine docs, not the
#   #   card, so lca sends it only to a local server and it is not pinned here.
#   hy3:                  {temperature: 0.9, top_p: 1.0,  effort: high}
#   # ^ hy3 accepts no_think|low|high and NOTHING else — medium or max raise
#   #   inside its chat template. Self-hosted hy3 does not think unless asked.
#
# roles:
#   fleet-lead:
#     description: Splits the task and delegates it.
#     tier: premium        # tiered, so -tier cheap rehearses the whole pipeline
#     effort: max          # kimi-k3 and MiniMax-M3 both accept it or ignore it
#     prompt: |
#       You lead a software task: split it and delegate each part.
#   fleet-coder:
#     description: Implements one change.
#     models: [deepseek-v4.1-flash, qwen3.6]   # pinned: chosen for code, not price
#     effort: high         # deepseek accepts it; qwen3.6 takes no effort field
#     review: fleet-reviewer
#     check_cmd: go test ./...
#     prompt: |
#       You implement exactly one change and make its check pass.
#   fleet-reviewer:
#     description: Judges the coder's diff — a different family on purpose.
#     models: [glm5.3, kimi-k3]   # neither is DeepSeek or Qwen: no shared blind spot
#     effort: max
#     prompt: |
#       You review one finished diff and name the failure mode you found.
apply: verified        # delegate diffs reach your tree only when the check passed
#                      # verified | always | never | branch. "branch" puts each
#                      # delegation on a real lca/<role>/<session>-<task> branch and
#                      # merges it three-way into your working tree: a conflict is
#                      # then a real conflict, the branch survives a failure, and
#                      # /branches, /merge and `lca clean --branches` manage them.
#                      # Declare a role literally named "integrator" to give a
#                      # conflict ONE supervised resolution attempt before it
#                      # goes to you — one, whatever verify_attempts says.

# named model chains, so price is one edit instead of one per role. A role points
# at a chain with "tier: <name>"; -tier / LCA_TIER / `lca run -tier` /
# `lca eval -tier cheap,premium` repoint every role that declares one for the run.
# A role that names models: is pinned and no -tier moves it.
tiers:
  premium: [kimi-k2.6, glm-5.2]
  cheap:   [qwen3-30b-a3b-instruct]

# the machines this team works on. ssh is outbound only; nothing listens here.
# Pin a role with "member: <name>", a workflow step with "member:" — otherwise
# work happens on this machine (or on defaults.member, if you set one).
# EDIT THE HOST AND DIR, or delete this block: lca doctor probes every member.
members:
  build-box:
    host: build01                 # ssh target (a ~/.ssh/config alias is fine)
    dir: /srv/work/llmbench       # the project over there — absolute, no ~
    allow: [go, gofmt, git, make, ls, cat, grep]   # REPLACES sandbox.allow here

defaults:
  context: 128000
  steps: 50
  verify_attempts: 2   # failing check output is fed back this many times in total
  check_timeout: 900   # seconds
  # review: reviewer   # a team-wide second opinion; per-role review: wins
  # member: build-box  # where roles that name no member: work

sandbox:
  # commands agents and verifiers may run. GPU work only via bsk.
  allow: [go, gofmt, git, make, python3, pytest, ls, cat, head, tail, wc, grep, find, echo, bsk]
  # shell: true      # let commands run through sh, so pipes, redirects and &&
  #                  # work; every command in the line is still allowlisted

roles:
  lead:
    description: Understands the task, splits it, delegates, integrates and reports.
    tier: premium        # `lca run harden -tier cheap` rehearses the pipeline cheaply
    effort: high
    context: 200000
    tools: [list_dir, glob, grep, read_file, todowrite, delegate, run_command]
    prompt: |
      You lead a software task. Read enough code to understand it, then split it
      into self-contained changes and delegate each to the coder role with a
      precise task and a narrow check_cmd that fails before and passes after.
      Launch independent delegations in one reply. Integrate the results: a
      passed diff is already applied; on failed, sharpen the task or split it.
      Finish with a short report of what changed and what was verified.

  coder:
    description: Implements one well-specified change and makes its check pass.
    models: [qwen3-coder-480b-a35b-instruct, deepseek-v4-pro]
    # pinned on purpose: a coder chain is chosen for code, not for price.
    # member: build-box  # its sessions (and their worktrees) live on that machine
    review: reviewer     # after the check passes, reviewer judges the diff and can
                         # block the apply with "VERDICT: reject" (review: none = off)
    fork: true           # start from the files the lead already read, not blank
    effort: medium
    context: 128000
    tools: [list_dir, glob, grep, read_file, edit, write, run_command]
    check_cmd: go test ./...
    prompt: |
      You implement exactly one change in an isolated worktree. Read the
      relevant code first, make the smallest correct change, and run the check
      command yourself until it passes. Don't refactor unrelated code.

  reviewer:
    description: Reads a finished diff and judges it, on a different family than the coder.
    # pinned, not tiered: a second opinion from the coder's own family shares the
    # blind spots the review exists to find (the loader warns when it does).
    models: [glm-5.2, kimi-k2.6]
    effort: high
    context: 200000
    tools: [list_dir, glob, grep, read_file, write, run_command]
    prompt: |
      You review one finished diff. Read the files it touches before judging it,
      run what you need to convince yourself, and name the failure mode you
      found — not style. A verdict with no reason is worthless.

  cheap:
    description: Summaries and compaction.
    models: [qwen3-30b-a3b-instruct]
    effort: off
    context: 32000
    tools: []
